# Publishes the static page as a live demo. Run it by hand (Actions tab, "Run
# workflow") after the repo is public and Pages is set to "GitHub Actions".
name: pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: npm test
      - name: Stage the site
        run: |
          mkdir _site
          cp index.html styles.css _site/
          cp -r src _site/src
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
